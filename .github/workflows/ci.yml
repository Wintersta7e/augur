name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit mypy pytest-cov

      - name: Audit pinned deps for known CVEs
        run: pip-audit -r requirements.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (report-only)
        # mypy currently reports ~40 errors, most are false positives from
        # redis-py / nats-py library typing. Non-blocking until cleaned up
        # module by module. Issues surface as annotations on PRs.
        continue-on-error: true
        run: |
          mypy --ignore-missing-imports --no-strict-optional \
            --explicit-package-bases \
            blackboard/ detection/ reasoning/ perception/ output/ augur_mcp/

      - name: Run unit tests
        run: |
          pytest tests/ --ignore=tests/integration -v \
            --cov=blackboard --cov=detection --cov=reasoning \
            --cov=perception --cov=output --cov=augur_mcp \
            --cov-report=xml --cov-report=term

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  integration:
    name: Fast integration tests
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            nats:2-alpine --jetstream --http_port 8222

      - name: Wait for services to become healthy
        run: |
          for i in $(seq 1 30); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG \
               && curl -sf http://localhost:8222/healthz > /dev/null 2>&1; then
              echo "Services ready"
              exit 0
            fi
            sleep 1
          done
          echo "Services failed to become ready within 30 seconds"
          docker logs redis || true
          docker logs nats || true
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast integration tests
        run: pytest tests/integration/ -m "not slow" -v

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== Redis logs ==="
          docker logs redis || true
          echo "=== NATS logs ==="
          docker logs nats || true

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: augur:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-import core modules
        run: |
          docker run --rm augur:ci python -c "import detection.anomaly_detector; import reasoning.correlator; import reasoning.augur_advisor; import perception.feedback_collector; import perception.activity_monitor; import output.console_display; import augur_mcp.augur_server; print('core modules import OK')"
