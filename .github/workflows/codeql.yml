name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly-published advisories surface even on a quiet repo.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended = full security coverage, incl. lower-severity
          # security queries. The security-and-quality suite is intentionally
          # dropped: its maintainability/style queries (empty-except, unused
          # variables, unreachable/ineffectual statements, import-and-import-from)
          # duplicate ruff -- this repo's linter -- and only produced note-level
          # noise, not security findings.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
