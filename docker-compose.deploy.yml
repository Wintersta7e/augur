services:
  vigil:
    build: .
    command: python -m vigil.anomaly_detector
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      AUGUR_NATS_URL: nats://nats:4222
      AUGUR_REDIS_URL: redis://redis:6379
    restart: unless-stopped

  nexus:
    build: .
    command: python -m nexus.correlator
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      AUGUR_NATS_URL: nats://nats:4222
      AUGUR_REDIS_URL: redis://redis:6379
    restart: unless-stopped

  consilium:
    build: .
    command: python -m consilium.advisor
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      nexus:
        condition: service_started
    environment:
      AUGUR_NATS_URL: nats://nats:4222
      AUGUR_REDIS_URL: redis://redis:6379
      AUGUR_OLLAMA_URL: http://host.docker.internal:11434
    restart: unless-stopped

  responsum:
    build: .
    command: python -m responsum.feedback_collector
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      AUGUR_NATS_URL: nats://nats:4222
      AUGUR_REDIS_URL: redis://redis:6379
    restart: unless-stopped

  disciplina:
    build: .
    command: python -m disciplina.reflection_engine
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      AUGUR_NATS_URL: nats://nats:4222
      AUGUR_REDIS_URL: redis://redis:6379
      AUGUR_OLLAMA_URL: http://host.docker.internal:11434
    restart: unless-stopped

  vox:
    build: .
    command: python -m vox.console_display
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      AUGUR_NATS_URL: nats://nats:4222
      AUGUR_REDIS_URL: redis://redis:6379
    restart: unless-stopped

  praefectus:
    build: .
    command: python -m praefectus.monitor
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      AUGUR_NATS_URL: nats://nats:4222
      AUGUR_REDIS_URL: redis://redis:6379
    restart: unless-stopped
