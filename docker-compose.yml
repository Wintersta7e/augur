services:
  redis:
    image: redis:7-alpine
    # SEC-06: bind Redis to 127.0.0.1 only. Previously bound to all
    # interfaces with no password, exposing all Augur state to any
    # LAN-reachable host. Single-operator local use should not expose
    # these ports beyond loopback.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  nats:
    image: nats:2-alpine
    # SEC-05 / SEC-06: bind NATS client and monitoring ports to
    # 127.0.0.1. The monitoring port (/varz, /connz, /subsz) discloses
    # the full subscription topology, which should not be reachable
    # from the LAN.
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: --jetstream --store_dir /data --http_port 8222
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Test cell bus. Started only via: --profile test
  # Separate endpoint, NOT a separate subject namespace: subjects are global
  # per server, so sharing 4222 would let live faculties consume test events.
  nats-test:
    image: nats:2-alpine
    profiles: ["test"]
    ports:
      - "127.0.0.1:4223:4222"
      - "127.0.0.1:8223:8222"
    command: --jetstream --http_port 8222

volumes:
  redis-data:
  nats-data:
